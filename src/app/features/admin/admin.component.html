<div class="admin">

    <a
      mat-tab-link
      routerLink="usuarios"
      routerLinkActive
      #rlaUsuarios="routerLinkActive"
      [active]="rlaUsuarios.isActive"
    >
      Usuarios
    </a>
    <a
      mat-tab-link
      routerLink="roles"
      routerLinkActive
      #rlaRoles="routerLinkActive"

    >
      Roles
    </a>
  </nav>

  <mat-tab-nav-panel #tabPanel>
    <div class="admin__content">
      <router-outlet />
    </div>
  </mat-tab-nav-panel>

</div>
